<HTML>
    <HEAD>
        <TITLE>Sample form</TITLE>
    </HEAD>
    <BODY BGCOLOR="AQUA">
        <CENTER>REGISTRATION FORM</CENTER>
        <HR color="red" size="5">
        <FORM>
            <LABEL>FIRST NAME<SUP>*</SUP></LABEL>
            <input type="text" placeholder="First name"> <br><br> <LABEL>LAST NAME</LABEL>
            <input type="text" placeholder="Last name"> <br><br> <LABEL>Date of Birth</LABEL>
            <input type="date"> <br><br> <LABEL>Age</LABEL>
            <input type="number"> <br><br> <LABEL>Gender:</LABEL>
            <input type="radio" name="M"/> Male <br>
            <input type="radio" name="M"/> Female<br><br>
            <LABEL>Education:</LABEL>
            <input type="checkbox">+2<input type="checkbox">UG
            <input type="checkbox">PG<input type="checkbox">Diploma<br><br>
            <label>Upload Passport Size Photo</label>(JPG/JPEG MAX 10)
            <input type="File" accept=".jpg,.jpeg"><br>
            <label>Declaration:</label><br><textarea rows="3" cols="19"></textarea>
            <center><br><input type="Submit"><input type="reset"></center>
        </FORM>

    </BODY>
</HTML>
